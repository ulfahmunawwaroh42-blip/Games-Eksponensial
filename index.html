  <style>
    :root {
      --ink: #102a43;
      --navy: #0b2545;
      --blue: #176b87;
      --aqua: #64ccc5;
      --paper: #f7f4ed;
      --sun: #ffd166;
      --coral: #ef8354;
    }

    * { box-sizing: border-box; }
    html { background: #f7f4ed; }
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }

    .app-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      background:
        radial-gradient(circle at 10% 0%, rgba(100, 204, 197, .25), transparent 26rem),
        radial-gradient(circle at 100% 100%, rgba(255, 209, 102, .22), transparent 30rem),

    }

    .math-font { font-family: "Fraunces", serif; }
    .grid-lines {
      background-image: linear-gradient(rgba(11,37,69,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(11,37,69,.055) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .view { display: none; }
    .view.active { display: block; animation: enter .48s ease both; }

    @keyframes enter {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .formula-card {
      border-left: 5px solid var(--aqua);
      box-shadow: 0 12px 30px rgba(16,42,67,.08);
    }

    .rule-card {
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .rule-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 24px rgba(16,42,67,.10);
    }

    .answer-option {
      border: 2px solid #d8e2e9;
      transition: all .2s ease;
    }
    .answer-option:hover { border-color: #64ccc5; background: #f0fffe; }
    .answer-option.selected { border-color: #176b87; background: #e4f8f6; }
    .answer-option.correct { border-color: #218c74; background: #e9f9f0; }
    .answer-option.incorrect { border-color: #d75a4a; background: #fff1ee; }
    .answer-option:focus-within { outline: 3px solid rgba(23,107,135,.3); outline-offset: 2px; }

    .choice-radio { accent-color: #176b87; }
    .progress-fill { transition: width .35s ease; }
    .hidden-accessible { display: none; }
    .status-show { display: block; }

    button:focus-visible, input:focus-visible {
      outline: 3px solid #ffd166;
      outline-offset: 3px;
    }

    @media (max-width: 640px) {
      .hero-title { font-size: 2.7rem !important; }
    }

    <section id="result-view" class="view mx-auto max-w-3xl" aria-labelledby="result-title">
     <div data-template-id="result-card" class="canva-card overflow-hidden rounded-[2rem] bg-white text-center shadow-2xl shadow-[#102a43]/10">
      <div class="bg-[#0b2545] px-7 py-10">
       <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-[#ffd166] text-[#0b2545]" aria-hidden="true"><i data-lucide="award" class="h-8 w-8"></i>
       </div>
       <h1 id="result-title" data-template-id="result-title-text" class="canva-text math-font mt-5 text-4xl font-bold text-[#f7f4ed]"></h1>
       <p data-template-id="result-subtitle" class="canva-text mt-3 text-[#d8e9e7]"></p>
      </div>
      <div class="p-8 sm:p-10">
       <div class="mx-auto grid max-w-md grid-cols-2 gap-4">
        <div class="rounded-2xl bg-[#e4f8f6] p-5">
         <p data-template-id="score-label" class="canva-text text-sm font-bold text-[#176b87]"></p>
         <p id="final-score" class="math-font mt-1 text-4xl font-bold text-[#0b2545]" aria-live="polite">0</p>
        </div>
        <div class="rounded-2xl bg-[#fff5d6] p-5">
         <p data-template-id="correct-label" class="canva-text text-sm font-bold text-[#a56b00]"></p>
         <p id="final-correct" class="math-font mt-1 text-4xl font-bold text-[#0b2545]" aria-live="polite">0/4</p>
        </div>
       </div>
       <p id="save-status" class="mt-7 rounded-xl bg-[#edf7f6] px-4 py-3 text-sm font-semibold text-[#176b87]" role="status"></p><button id="restart-button" data-template-id="restart-button-text" type="button" class="canva-button mt-7 inline-flex items-center gap-2 rounded-xl bg-[#ef8354] px-6 py-3.5 font-bold text-white shadow-lg shadow-[#ef8354]/25 transition hover:-translate-y-0.5 hover:bg-[#d96d41]"> <span data-template-id="restart-button-label" class="canva-text"></span><i data-lucide="rotate-ccw" class="h-5 w-5"></i> </button>
      </div>
     </div>
    </section>
   </main>
   <footer class="w-full px-5 pb-7 text-center sm:px-8">
    <p data-template-id="copyright-text" class="canva-text mt-2 text-xs text-[#627d98]"></p>
   </footer>
  </div>
  <script>
    const answers = ["b", "a", "c", "b"];
    const feedbacks = [
      "Tepat! 2⁴ = 2 × 2 × 2 × 2 = 16.",
      "Benar! Saat basis sama dikalikan, pangkatnya dijumlahkan.",
      "Hebat! Pangkat negatif berarti kebalikan dari bentuk pangkat positif.",
      "Benar! Bilangan berpangkat nol bernilai 1, selama basisnya bukan 0."
    ];

    let student = { nama: "", kelas: "" };
    let currentQuestion = 0;
    let correctAnswers = 0;
    let selectedAnswers = [];
    let isSaving = false;

    const views = {
      intro: document.getElementById("intro-view"),
      lesson: document.getElementById("lesson-view"),
      quiz: document.getElementById("quiz-view"),
      result: document.getElementById("result-view")
    };

    function showView(name) {
      Object.values(views).forEach(view => view.classList.remove("active"));
      views[name].classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function setQuestion(index) {
      currentQuestion = index;
      document.querySelectorAll(".question-card").forEach((card, cardIndex) => {
        card.classList.toggle("hidden-accessible", cardIndex !== index);
      });
      document.getElementById("question-counter").textContent = `Soal ${index + 1} dari 4`;
      document.getElementById("progress-bar").style.width = `${(index + 1) * 25}%`;

      const button = document.getElementById("next-question");
      button.disabled = !selectedAnswers[index];
      button.querySelector("span").textContent = index === 3 ? "Lihat hasil" : "Soal berikutnya";
    }

    function handleChoice(event) {
      const input = event.target;
      if (!input.matches('input[type="radio"]')) return;

      const card = input.closest(".question-card");
      const questionIndex = Number(card.dataset.question) - 1;
      selectedAnswers[questionIndex] = input.value;

      card.querySelectorAll(".answer-option").forEach(option => option.classList.remove("selected", "correct", "incorrect"));
      input.closest(".answer-option").classList.add("selected");

      const isCorrect = input.value === answers[questionIndex];
      card.querySelectorAll(".answer-option").forEach(option => {
        const optionInput = option.querySelector("input");
        if (optionInput.value === answers[questionIndex]) option.classList.add("correct");
        if (optionInput.checked && !isCorrect) option.classList.add("incorrect");
      });

      const feedback = card.querySelector(".feedback");
      feedback.textContent = isCorrect ? feedbacks[questionIndex] : `Belum tepat. ${feedbacks[questionIndex]}`;
      feedback.className = `feedback mt-5 rounded-xl px-4 py-3 text-sm font-semibold ${isCorrect ? "bg-[#e9f9f0] text-[#187357]" : "bg-[#fff1ee] text-[#a63d2d]"}`;

      document.getElementById("next-question").disabled = false;
    }

    async function saveResult() {
      const status = document.getElementById("save-status");
      if (!window.dataSdk) {
        status.textContent = "Hasil belum dapat disimpan. Silakan coba ulangi beberapa saat lagi.";
        status.className = "mt-7 rounded-xl bg-[#fff1ee] px-4 py-3 text-sm font-semibold text-[#a63d2d]";
        return;
      }

      isSaving = true;
      status.textContent = "Menyimpan hasil ke Canva Sheet...";
      status.className = "mt-7 rounded-xl bg-[#edf7f6] px-4 py-3 text-sm font-semibold text-[#176b87]";

      const saveResult = await window.dataSdk.create({
        nama: student.nama,
        kelas: student.kelas,
        skor: Math.round((correctAnswers / 4) * 100),
        jawaban_benar: correctAnswers,
        jumlah_soal: 4,
        waktu_selesai: new Date().toISOString()
      });

      if (saveResult.isOk) {
        status.textContent = "Hasilmu sudah tersimpan di Canva Sheet.";
        status.className = "mt-7 rounded-xl bg-[#e9f9f0] px-4 py-3 text-sm font-semibold text-[#187357]";
      } else {
        status.textContent = "Hasil belum tersimpan. Periksa koneksi lalu coba ulangi pembelajaran.";
        status.className = "mt-7 rounded-xl bg-[#fff1ee] px-4 py-3 text-sm font-semibold text-[#a63d2d]";
      }
      isSaving = false;
    }

    async function finishQuiz() {
      correctAnswers = selectedAnswers.reduce((total, choice, index) => total + (choice === answers[index] ? 1 : 0), 0);
      const score = Math.round((correctAnswers / 4) * 100);

      document.getElementById("final-score").textContent = score;
      document.getElementById("final-correct").textContent = `${correctAnswers}/4`;
      showView("result");
      await saveResult();
    }

    function resetQuiz() {
      currentQuestion = 0;
      correctAnswers = 0;
      selectedAnswers = [];

      document.querySelectorAll('input[type="radio"]').forEach(input => { input.checked = false; });
      document.querySelectorAll(".answer-option").forEach(option => option.classList.remove("selected", "correct", "incorrect"));
      document.querySelectorAll(".feedback").forEach(feedback => {
        feedback.textContent = "";
        feedback.className = "feedback mt-5 hidden-accessible rounded-xl px-4 py-3 text-sm font-semibold";
      });

      setQuestion(0);
    }

    document.getElementById("identity-form").addEventListener("submit", event => {
      event.preventDefault();
      const nameInput = document.getElementById("nama");
      const classInput = document.getElementById("kelas");
      const error = document.getElementById("identity-error");

      if (!nameInput.value.trim() || !classInput.value.trim()) {
        error.textContent = "Lengkapi nama dan kelas terlebih dahulu.";
        error.classList.remove("hidden-accessible");
        return;
      }

      error.classList.add("hidden-accessible");
      student = { nama: nameInput.value.trim(), kelas: classInput.value.trim() };
      document.getElementById("student-pill").textContent = `${student.nama} · ${student.kelas}`;
      document.getElementById("lesson-student-name").textContent = `${student.nama} · ${student.kelas}`;
      showView("lesson");
    });

    document.getElementById("to-quiz").addEventListener("click", () => {
      resetQuiz();
      showView("quiz");
    });

    document.querySelectorAll(".question-card").forEach(card => card.addEventListener("change", handleChoice));

    document.getElementById("next-question").addEventListener("click", () => {
      if (!selectedAnswers[currentQuestion]) return;
      if (currentQuestion === 3) {
        finishQuiz();
      } else {
        setQuestion(currentQuestion + 1);
      }
    });

    document.getElementById("restart-button").addEventListener("click", () => {
      if (isSaving) return;
      document.getElementById("identity-form").reset();
      document.getElementById("student-pill").textContent = "Belajar mandiri";
      showView("intro");
    });

    async function initializeSheet() {
      if (!window.dataSdk) return;
      const handler = { onDataChanged() {} };
      await window.dataSdk.init(handler);
    }

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      initializeSheet();
    });
  </script>
 </body>
</html>
